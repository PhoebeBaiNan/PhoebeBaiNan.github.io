<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="湖北大学《安全编程》课程入口">
  <title>《安全编程》课程入口</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #637083;
      --line: #dfe6ef;
      --primary: #185abd;
      --primary-hover: #104a9e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    main {
      width: min(760px, 100%);
    }

    header {
      margin-bottom: 22px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(26px, 5vw, 38px);
      letter-spacing: .04em;
    }

    header p,
    footer {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .courses {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .course {
      display: flex;
      min-height: 210px;
      flex-direction: column;
      padding: 26px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--card);
      box-shadow: 0 8px 26px rgba(31, 50, 82, .07);
    }

    .course small {
      color: var(--primary);
      font-weight: 700;
    }

    .course h2 {
      margin: 12px 0 6px;
      font-size: 21px;
      line-height: 1.45;
    }

    .course p {
      margin: 0 0 22px;
      color: var(--muted);
    }

    .button {
      display: block;
      margin-top: auto;
      padding: 12px 18px;
      border-radius: 9px;
      color: #fff;
      background: var(--primary);
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      transition: background .15s ease, transform .15s ease;
    }

    .button:hover,
    .button:focus-visible {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .button:focus-visible {
      outline: 3px solid rgba(24, 90, 189, .22);
      outline-offset: 3px;
    }

    footer {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
    }

    @media (max-width: 620px) {
      .courses { grid-template-columns: 1fr; }
      .course { min-height: 0; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>《安全编程》课程入口</h1>
      <p>请选择对应教学班，进入学习通课程门户。</p>
    </header>

    <section class="courses" aria-label="课程入口">
      <article class="course">
        <small>教学班 01</small>
        <h2>信安2201—2202</h2>
        <p>共72人</p>
        <a class="button" href="https://mooc1.chaoxing.com/mooc-ans/course/portal/dA08GGdz4AbYXYiYPZtwTg==" target="_blank" rel="noopener noreferrer">进入课程</a>
      </article>

      <article class="course">
        <small>教学班 02</small>
        <h2>信安2203—2204</h2>
        <p>共66人</p>
        <a class="button" href="https://mooc1.chaoxing.com/mooc-ans/course/portal/v3_HAlFLOYqZXA3InFKDhA==" target="_blank" rel="noopener noreferrer">进入课程</a>
      </article>
    </section>

    <footer>
      电脑端和手机端均可点击访问；课程内容以学习通平台实际显示为准。
    </footer>
  </main>
</body>
</html>
